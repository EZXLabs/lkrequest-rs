[package]
name = "lktls"
version = "0.2.4"
edition = "2021"
description = "Sans-I/O TLS fingerprint protocol engine for lkrequest"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/lktls"
keywords = ["tls", "fingerprint", "clienthello", "browser", "sans-io"]
categories = ["cryptography", "network-programming"]

[dependencies]
aws-lc-rs = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
hpke = { workspace = true }
rand_core = { workspace = true }
rustls-webpki = { workspace = true }
webpki-roots = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
brotli = { workspace = true }
flate2 = { workspace = true }
zstd = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5" }
tracing-subscriber = { version = "0.3", features = ["registry"] }
rcgen = { version = "0.14", features = ["aws_lc_rs"] }
rand_chacha = { workspace = true }

[[bench]]
name = "crypto_bench"
harness = false

[[bench]]
name = "handshake_bench"
harness = false
