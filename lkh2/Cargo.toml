[package]
name = "lkh2"
version = "0.2.3"
edition = "2021"
description = "HTTP/2 fingerprint-controlled connection library"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/lkh2"
keywords = ["http2", "fingerprint", "hpack", "browser", "networking"]
categories = ["network-programming", "web-programming::http-client"]

[features]
default = ["h2-native"]
# Backward-compatible alias. The fingerprint-controlled native engine is now
# the only HTTP/2 implementation and is always compiled.
# Deprecated no-op compatibility alias. Remove completely in 0.3.0.
h2-native = []


[dependencies]
http = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures-core = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
rand_core = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
h2 = { workspace = true }
lktls = { path = "../lktls" }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { workspace = true }
rand_chacha = { workspace = true }
