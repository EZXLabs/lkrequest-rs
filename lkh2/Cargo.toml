[package]
name = "lkh2"
version = "0.2.2"
edition = "2021"
description = "HTTP/2 fingerprint-controlled connection library"

[features]
default = ["h2-native"]
# Backward-compatible alias. The fingerprint-controlled native engine is now
# the only HTTP/2 implementation and is always compiled.
h2-native = []


[dependencies]
fluke-hpack = "0.3"
http = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
rand_core = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
fluke-hpack = "0.3"
h2 = { workspace = true }
lktls = { path = "../lktls" }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { workspace = true }
rand_chacha = { workspace = true }
