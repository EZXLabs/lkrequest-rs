[package]
name = "lkquic"
version = "0.2.4"
edition = "2024"
description = "QUIC endpoint management and transport integration for lkrequest"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/lkquic"
keywords = ["quic", "http3", "networking", "async", "browser"]
categories = ["network-programming", "web-programming::http-client"]

[features]
default = ["quinn-backend"]
quinn-backend = ["dep:quinn", "dep:quinn-proto"]

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }

quinn = { workspace = true, optional = true, features = ["runtime-tokio", "ring", "rustls"] }
quinn-proto = { workspace = true, optional = true, features = ["ring"] }

[dev-dependencies]
tokio = { workspace = true }
rcgen = "0.13"
