[package]
name = "lktls-quic"
version = "0.2.4"
edition = "2021"
description = "QUIC TLS 1.3 bridge from lktls to Quinn"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/lktls-quic"
keywords = ["quic", "tls", "fingerprint", "browser", "networking"]
categories = ["cryptography", "network-programming"]

[dependencies]
lktls = { path = "../lktls", version = "0.2.4" }
quinn-proto = { workspace = true }
quinn = { workspace = true, features = ["runtime-tokio", "ring", "rustls"] }
bytes = { workspace = true }
http = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
aws-lc-rs = { workspace = true }
aes = { workspace = true }
chacha20 = "0.9"
rustls-pki-types = { workspace = true }

[dev-dependencies]
lkprofile = { path = "../lkprofile" }
lkh3 = { path = "../lkh3" }
h3 = { path = "../deps/h3/h3" }
h3-quinn = { path = "../deps/h3/h3-quinn" }
tokio = { workspace = true }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
