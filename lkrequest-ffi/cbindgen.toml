language = "C"
cpp_compat = true
pragma_once = false
include_guard = "LKREQUEST_H"
usize_is_size_t = true
documentation = true
sort_by = "Name"
no_includes = true
autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Do not edit manually. */"

header = """
/*
 * Threading / lifetime notes:
 * - Client / Session / Op handles may be shared across threads.
 * - Request / StreamingResponse are single-owner handles and must not be driven concurrently.
 * - Borrowed pointers are owned by their handle. Except for cookie and streaming chunk views,
 *   they remain valid until that handle is freed.
 * - Streaming chunk views are invalidated by the next mutating stream read, close, or free.
 * - Session cookie views are invalidated when their query is repeated or a cookie setter,
 *   removal, or clear runs. Copy them before such calls and synchronize reads with those calls.
 * - All handles must be released with their matching free function.
 */
"""

after_includes = """
#include <stdbool.h>
#include <stddef.h>
#include <stdint.h>

typedef struct lk_client_t lk_client_t;
typedef struct lk_client_builder_t lk_client_builder_t;
typedef struct lk_session_t lk_session_t;
typedef struct lk_session_builder_t lk_session_builder_t;
typedef struct lk_request_t lk_request_t;
typedef struct lk_response_t lk_response_t;
typedef struct lk_streaming_response_t lk_streaming_response_t;
typedef struct lk_error_t lk_error_t;
typedef struct lk_op_t lk_op_t;
typedef struct lk_proxy_config_t lk_proxy_config_t;
typedef struct lk_proxy_pool_t lk_proxy_pool_t;
typedef struct lk_proxy_pool_builder_t lk_proxy_pool_builder_t;
typedef struct lk_proxy_guard_t lk_proxy_guard_t;
typedef struct lk_socks5_udp_probe_report_t lk_socks5_udp_probe_report_t;
typedef struct lk_session_pool_t lk_session_pool_t;
typedef struct lk_session_pool_builder_t lk_session_pool_builder_t;
typedef struct lk_session_pool_guard_t lk_session_pool_guard_t;
typedef struct lk_multipart_t lk_multipart_t;
typedef struct lk_masque_config_t lk_masque_config_t;

typedef struct lk_bytes_view_t {
  const uint8_t* ptr;
  size_t len;
} lk_bytes_view_t;

#define LK_ACCEPT_ENCODING_GZIP 0x01
#define LK_ACCEPT_ENCODING_BR 0x02
#define LK_ACCEPT_ENCODING_DEFLATE 0x04
#define LK_ACCEPT_ENCODING_ZSTD 0x08
"""

[parse]
parse_deps = false

[export]
exclude = [
  "LKREQUEST_FFI_ABI_VERSION",
  "lk_client_t",
  "lk_client_builder_t",
  "lk_session_t",
  "lk_session_builder_t",
  "lk_request_t",
  "lk_response_t",
  "lk_streaming_response_t",
  "lk_error_t",
  "lk_op_t",
  "lk_proxy_config_t",
  "lk_proxy_pool_t",
  "lk_proxy_pool_builder_t",
  "lk_proxy_guard_t",
  "lk_socks5_udp_probe_report_t",
  "lk_session_pool_t",
  "lk_session_pool_builder_t",
  "lk_session_pool_guard_t",
  "lk_multipart_t",
  "lk_masque_config_t",
  "lk_bytes_view_t",
]
