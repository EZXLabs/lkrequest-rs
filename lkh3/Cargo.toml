[package]
name = "lkh3"
version = "0.2.3"
edition = "2021"
description = "HTTP/3 and QUIC fingerprint profiles for lkrequest"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/lkh3"
keywords = ["http3", "quic", "fingerprint", "qpack", "browser"]
categories = ["network-programming", "web-programming::http-client"]

[dependencies]
bytes = { workspace = true }
futures-core = "0.3"
h3 = { path = "../deps/h3/h3" }
h3-quinn = { path = "../deps/h3/h3-quinn" }
http = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
rand_core = { workspace = true }

[dev-dependencies]
quinn = { path = "../deps/quinn/quinn", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = { workspace = true }
rand_chacha = { workspace = true }
