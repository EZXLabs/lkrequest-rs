[package]
name = "http-client-bench"
version = "0.1.0"
edition = "2021"
publish = false

[features]
quic-h3 = ["lkrequest/quic-h3", "dep:quinn", "dep:h3", "dep:h3-quinn", "dep:rcgen", "dep:rustls", "dep:tokio-rustls", "dep:async-trait"]

[dependencies]
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http2", "server"] }
hyper-util = { workspace = true, features = ["client", "client-legacy", "http2", "server", "tokio"] }
lkh2 = { path = "../../lkh2" }
lkrequest = { path = "../../lkrequest", features = ["bench-internals"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["http2"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true, optional = true }
quinn = { workspace = true, optional = true, features = ["runtime-tokio", "ring", "rustls"] }
h3 = { path = "../../deps/h3/h3", optional = true }
h3-quinn = { path = "../../deps/h3/h3-quinn", optional = true }
rcgen = { version = "0.14", optional = true, features = ["aws_lc_rs"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.52.0", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
