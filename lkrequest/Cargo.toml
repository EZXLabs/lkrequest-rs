[package]
name = "lkrequest"
version = "0.2.3"
edition = "2021"
description = "HTTP client with fine-grained TLS fingerprint control"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/lkrequest"
keywords = ["http", "client", "tls", "fingerprint", "http3"]
categories = ["network-programming", "web-programming::http-client"]

[features]
default = ["h2-native"]

doh = ["hickory-resolver/https-aws-lc-rs"]
# Deprecated backward-compatible alias. HTTP/2 always uses lkh2 and no longer
# has an alternate backend. Remove this feature completely in 0.3.0.
h2-native = ["lkh2/h2-native"]
quic-h3 = ["dep:lktls-quic", "dep:lkh3", "dep:lkquic", "dep:quinn", "dep:h3", "dep:h3-quinn"]
# MASQUE (RFC 9298 CONNECT-UDP) proxy support. Off by default: it pulls in the
# tunnel layer and only helps deployments that actually have a MASQUE proxy.
# Implies `quic-h3` — the outer hop is HTTP/3 and the inner one is QUIC, so
# without it there is nothing for a tunnel to ride on or to carry.
masque = ["quic-h3", "dep:lkmasque"]
# Tier-2 integration tests that hit the public internet (not enabled in CI).
network-e2e = []
# Operational telemetry (bandwidth / connection / request counters). Off by
# default so non-observed deployments carry zero transport instrumentation.
telemetry = []
bench-internals = []
# Synthetic (Tier 3a/3b) fingerprint randomization — produces fingerprints that
# match no real browser. Escape hatch for negative-model blocklists; off by
# default so it can't be enabled by accident against allowlist targets.
synthetic-fp = ["dep:rand_chacha", "dep:rand_core"]

[dependencies]
lktls = { path = "../lktls", version = "0.2.3" }
lktls-quic = { path = "../lktls-quic", version = "0.2.3", optional = true }
lkh2 = { path = "../lkh2", version = "0.2.3", default-features = false }
lkh3 = { path = "../lkh3", version = "0.2.3", optional = true }
lkquic = { path = "../lkquic", version = "0.2.3", optional = true }
lkmasque = { path = "../lkmasque", version = "0.2.3", optional = true }
quinn = { workspace = true, optional = true, features = ["runtime-tokio", "ring", "rustls"] }
# The MASQUE bridge speaks the outer HTTP/3 connection directly: it must issue
# an extended CONNECT with `:protocol = connect-udp` and read datagrams off the
# raw quinn connection, neither of which `lkh3`'s profile-driven sender exposes.
# Both are the workspace's patched forks, same as `lkh3` uses.
h3 = { path = "../deps/h3/h3", optional = true }
h3-quinn = { path = "../deps/h3/h3-quinn", optional = true }
arc-swap = { workspace = true }
parking_lot = { workspace = true }
aws-lc-rs = { workspace = true }
rand_chacha = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
rustls-pki-types = { workspace = true }
socket2 = { workspace = true }
libc = { workspace = true }
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
http-body = "1"
futures-core = "0.3"
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
url = { workspace = true }
cookie_store = { workspace = true }
cookie = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
hickory-resolver = { workspace = true }
async-trait = { workspace = true }
brotli = { workspace = true }
flate2 = { workspace = true }
zstd = { workspace = true }
base64 = { workspace = true }
bitflags = { workspace = true }
fastwebsockets = { workspace = true }
rustls-native-certs = "0.8"

[dev-dependencies]
lkprofile = { path = "../lkprofile" }
fpverify = { path = "../tools/fpverify" }
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { workspace = true }
serde_json = { workspace = true }
urlencoding = "2"
tracing-subscriber = { version = "0.3", features = ["registry", "fmt", "env-filter"] }
hyper-util = { workspace = true, features = ["server-auto", "http1", "http2"] }
rcgen = { version = "0.14", features = ["aws_lc_rs"] }
tokio-rustls = "0.26"
headless_chrome = "1.0"
libloading = "0.8"
h3 = { path = "../deps/h3/h3" }
h3-quinn = { path = "../deps/h3/h3-quinn" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[[bench]]
name = "request_bench"
harness = false

[[bench]]
name = "offline_bench"
harness = false

[[bench]]
name = "multipart_bench"
harness = false

