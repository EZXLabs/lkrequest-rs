[package]
name = "lkprofile"
version = "0.2.2"
edition = "2021"
description = "Parse TLS ClientHello and HTTP/2 frames into fingerprint profiles"
publish = false

[dependencies]
lktls = { path = "../lktls" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
md-5 = "0.10"
thiserror = "2"
